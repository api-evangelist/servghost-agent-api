name: ServGhost Agent API
description: Agent-native offshore hosting provider offering Linux VPS, dedicated servers, Windows RDP, GPU AI compute,
  and anonymous domain registration across 7 jurisdictions. No-KYC, no-logs, crypto-only with instant automated
  deployment designed for end-to-end purchase by AI agents. Exposes a REST API (OpenAPI 3.1), a hosted MCP server,
  llms.txt, an agent.json discovery file, and x402 USDC payment support.
